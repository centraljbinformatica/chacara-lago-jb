<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Comanda para imprimir — Chácara Lago JB</title>
  <link rel="icon" href="img/logo.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <style>
    /* Tons de cinza escuro: imprimem nítido em impressora P&B (o design continua,
       só que monocromático = o que você vê é igual ao que sai no papel). */
    :root{ --azul:#232b33; --laranja:#3b444d; --linha:#b8c0cc; --txt:#1f2a37; }
    *{box-sizing:border-box;}
    html,body{margin:0; font-family:'Inter',system-ui,sans-serif; color:var(--txt); background:#e9edf2;}

    /* Barra de ações (some na impressão) */
    .acoes{
      position:sticky; top:0; z-index:5; background:#fff; border-bottom:1px solid #d7dde5;
      padding:12px 16px; display:flex; gap:12px; align-items:center; flex-wrap:wrap;
      box-shadow:0 2px 8px rgba(0,0,0,.05);
    }
    .acoes p{margin:0; font-size:.84rem; color:#6b7480; flex:1; min-width:180px;}
    .acoes b{color:var(--azul);}
    .toggle{display:inline-flex; background:#eef1f5; border-radius:30px; padding:4px; gap:2px;}
    .toggle button{
      font-family:inherit; font-weight:700; font-size:.86rem; cursor:pointer; border:none;
      background:transparent; color:#41506a; border-radius:30px; padding:8px 14px;
    }
    .toggle button.on{background:var(--azul); color:#fff;}
    .btn{
      font-family:inherit; font-weight:700; font-size:.92rem; cursor:pointer;
      border:none; border-radius:10px; padding:11px 18px;
      background:linear-gradient(135deg,#f47a1d,#d9641a); color:#fff;
    }
    .btn.sec{background:#eef1f5; color:#41506a;}

    /* Folha A4 */
    .folha{
      width:210mm; margin:18px auto; background:#fff;
      box-shadow:0 6px 24px rgba(0,0,0,.12);
    }
    .corte{
      text-align:center; font-size:8px; color:#9aa3af; letter-spacing:1px;
      border-top:1.2px dashed #9aa3af; padding-top:1mm; height:3mm;
    }

    /* Base da comanda */
    .comanda{ break-inside:avoid; page-break-inside:avoid; }

    .cab{display:flex; align-items:center; gap:9px; border-bottom:2.2px solid var(--azul); padding-bottom:4px;}
    .cab img{height:30px;}
    .cab .tit{flex:1;}
    .cab h1{font-family:'Cinzel',serif; color:var(--azul); margin:0; font-size:1.05rem; line-height:1;}
    .cab .sub{font-size:.64rem; color:#6b7480; margin-top:2px;}
    .cab .comanda-tag{
      font-weight:800; color:var(--laranja); border:1.5px solid var(--laranja);
      border-radius:6px; padding:3px 8px; font-size:.68rem; letter-spacing:.4px; white-space:nowrap;
    }

    .topo-campos{display:flex; gap:10px; flex-wrap:wrap; margin:5px 0 2px; font-size:.7rem;}
    .topo-campos .c{flex:1; min-width:80px; display:flex; align-items:flex-end; gap:5px;}
    .topo-campos .nome-c{flex:1.7;} .topo-campos .pessoas-c{flex:1.4;} /* equilibra: Nome não rouba a linha de "Nº de pessoas" */
    .topo-campos .c b{white-space:nowrap;}
    .linha-preencher{flex:1; border-bottom:1.1px solid var(--linha); height:1em;}

    .grade{margin-top:4px;}
    .cat{break-inside:avoid;}
    .cat h2{
      font-family:'Cinzel',serif; color:#fff; background:var(--azul);
      margin:0; padding:2px 6px; border-radius:4px 4px 0 0; letter-spacing:.2px;
      break-after:avoid; break-inside:avoid;
    }
    table{width:100%; border-collapse:collapse;}
    tr{break-inside:avoid;}
    td{padding:1.4px 3px; border-bottom:.6px solid #e7ebf0; line-height:1.1; vertical-align:middle;}
    .nome small{color:#8b95a3;}
    .pcol{text-align:right; color:var(--laranja); font-weight:700; white-space:nowrap;}
    .preco-livre{display:inline-block; width:38px; border-bottom:1px solid var(--linha); height:1em; vertical-align:middle;} /* preço a preencher */
    .qcol{text-align:right; white-space:nowrap; width:1%;}
    .qbox{display:inline-block; border:1.2px solid #4b5563; border-radius:2px; margin-left:2px; vertical-align:middle;}

    /* Linha de promoção "Drink em dobro" (destaque em cinza claro, imprime bem em P&B) */
    .promo-row td{background:#e9ecf0;}
    .promo-row .nome{color:var(--txt); font-weight:800; border-left:3px solid var(--azul); padding-left:5px;}
    .promo-row .pcol{color:var(--txt);}

    /* Rodapé */
    .rodape{margin-top:7px; border-top:1.4px dashed #9aa3af; padding-top:5px; display:flex; gap:12px; align-items:flex-end;}
    .rodape .bloco{flex:1;}
    .rot{font-weight:700; color:#6b7480; text-transform:uppercase; letter-spacing:.3px; margin-bottom:2px;}
    .pag-opcoes{display:flex; gap:10px; align-items:center; flex-wrap:wrap;}
    .check{display:inline-block; width:11px; height:11px; border:1.3px solid #41506a; border-radius:3px; vertical-align:-2px; margin-right:4px;}
    .obs-linha{border-bottom:1.1px solid var(--linha); height:1em; margin-top:3px;}
    .total-cx{max-width:150px;}
    .total-linha{display:flex; align-items:flex-end; gap:6px;}
    .total-linha b{color:var(--azul);}
    .legenda{text-align:center; color:#9aa3af; margin-top:3px;}

    /* ==========================================================
       MODO PRINCIPAL: 2 TIRAS VERTICAIS LADO A LADO (estilo restaurante)
       Cada comanda ocupa a ALTURA INTEIRA da folha, então sobra espaço
       e a letra fica grande. Itens numa coluna só, de cima pra baixo.
       ========================================================== */
    /* Sem min-height fixo: as duas tiras crescem com o conteúdo (ocupam quase
       a folha toda) e ficam SEMPRE em 1 página, sem risco de estourar pro A4. */
    .lado{ display:flex; align-items:stretch; }
    .lado > .comanda{
      flex:1 1 0; min-width:0;
      padding:6mm 6mm; display:flex; flex-direction:column;
    }
    .corte-v{
      display:flex; align-items:center; justify-content:center;
      border-left:1.4px dashed #9aa3af; margin:4mm 0;
    }
    .corte-v span{
      writing-mode:vertical-rl; transform:rotate(180deg);
      font-size:8px; color:#9aa3af; letter-spacing:2px; white-space:nowrap;
    }
    /* Tamanhos confortáveis pra ler e escrever à mão */
    .lado .cab img{height:26px;}
    .lado .cab h1{font-size:1.08rem;}
    .lado .cab{padding-bottom:3px;}
    .lado .cab .sub{font-size:.64rem;}
    .lado .topo-campos{gap:4px 10px; margin:5px 0 3px; font-size:.82rem;} /* em linha (quebra pra 2 linhas), poupa altura */
    .lado .grade{margin-top:4px;}
    .lado .cat{margin-bottom:2px;}
    .lado .cat h2{font-size:.84rem; padding:2px 8px;}
    .lado td{font-size:.9rem; padding:2px 4px;}
    .lado .nome small{display:none;} /* sem descrição na tira: mais limpo e cada item ocupa 1 linha só */
    .lado .qbox{width:14px; height:15px; margin-left:3px;}
    .lado .rodape{margin-top:auto; flex-direction:column; align-items:stretch; gap:6px; padding-top:6px;}
    .lado .rodape .bloco{flex:none;}
    .lado .total-cx{max-width:none;}
    .lado .rot{font-size:.7rem;}
    .lado .pag-opcoes{font-size:.9rem; gap:14px;}
    .lado .check{width:14px; height:14px;}
    .lado .obs-linha{height:1.2em;}
    .lado .total-linha{font-size:1.12rem;}
    .lado .legenda{font-size:.66rem; margin-top:5px;}

    /* 4 POR FOLHA EM 2x2 (comidas): células largas (metade da folha), fonte
       bem legível. Linhas tracejadas de corte no meio. Vale tanto pra folha
       única (.folha.quad) quanto pra cada página numerada (.pagina.quad). */
    .quad{display:grid; grid-template-columns:1fr 1fr;}
    .quad .comanda{
      padding:4mm 7mm; display:flex; flex-direction:column;
      border-right:1.2px dashed #9aa3af; border-bottom:1.2px dashed #9aa3af;
    }
    .quad .comanda:nth-child(2n){border-right:none;}            /* coluna da direita: sem borda à direita */
    .folha.quad > .comanda:nth-child(n+3){border-bottom:none;}  /* na folha única, tira a borda da fila de baixo */
    .quad .cab img{height:20px;}
    .quad .cab h1{font-size:1.02rem;}
    .quad .cab .sub{font-size:.6rem;}
    .quad .tipo-band{font-size:.74rem; margin:2px 0 1px;}
    .quad .topo-campos{gap:3px 14px; margin:2px 0 1px; font-size:.84rem;}
    .quad .topo-campos .c{min-width:0;}                         /* Nome + Pessoas numa linha só */
    .quad .nome-c{flex:1.9;}
    .quad .pessoas-c{flex:1.7;}
    .quad .grade{margin-top:1px;}
    .quad .cat{margin-bottom:0;}
    .quad .cat h2{font-size:.84rem; padding:1px 8px;}
    /* mesma fonte, mas entrelinha e padding menores pra caber o item novo sem estourar */
    .quad td{font-size:.92rem; padding:0.4px 4px; line-height:1.0;}
    .quad .nome small{display:none;}
    .quad .qbox{width:15px; height:16px; margin-left:3px;}
    .quad .rodape{margin-top:auto; flex-direction:column; align-items:stretch; gap:3px; padding-top:3px;}
    .quad .rodape .bloco{flex:none;}
    .quad .total-cx{max-width:none;}
    .quad .rot{font-size:.68rem;}
    .quad .total-linha{font-size:1.1rem;}
    .quad .legenda{display:none;}
    /* cozinha não precisa de Pagamento: some com esse trecho e sobra altura (mantém Observações e Total) */
    .quad .pag-rot,.quad .pag-opcoes{display:none;}

    /* Páginas da versão numerada: cada grupo de 4 numa folha A4 (quebra garantida) */
    .folha.numeradas{background:transparent; width:auto;}
    .pagina{break-after:page; page-break-after:always;}
    .pagina:last-child{break-after:auto; page-break-after:avoid;}
    @media screen{
      .pagina{background:#fff; box-shadow:0 6px 24px rgba(0,0,0,.12); margin:0 auto 18px; width:210mm;}
    }

    /* Tiras verticais mais estreitas (3 ou 4 por folha): ajusta pra caber na
       largura, mantendo a letra grande. Usado nas COMIDAS (poucos itens). */
    .folha.cols-3 .comanda,.folha.cols-4 .comanda{padding:6mm 4mm;}
    .cols-3 .corte-v,.cols-4 .corte-v{margin:3mm 0;}
    .cols-3 .topo-campos,.cols-4 .topo-campos{flex-direction:column; gap:5px;}

    .cols-3 .cab h1{font-size:.9rem;}
    .cols-3 .cat h2{font-size:.78rem;}
    .cols-3 td{font-size:.82rem; padding:2.6px 3px;}
    .cols-3 .qbox{width:13px; height:14px; margin-left:2px;}
    .cols-3 .topo-campos{font-size:.76rem;}
    .cols-3 .pag-opcoes{font-size:.74rem; gap:8px;}
    .cols-3 .total-linha{font-size:.94rem;}

    .cols-4 .cab img{height:20px;}
    .cols-4 .cab h1{font-size:.76rem;}
    .cols-4 .cab .sub{display:none;}
    .cols-4 .tipo-band{font-size:.58rem; letter-spacing:.3px; padding:2px 4px;}
    .cols-4 .cat h2{font-size:.68rem; padding:2px 6px;}
    .cols-4 td{font-size:.72rem; padding:2.2px 3px;}
    .cols-4 .nome small{display:none;}
    .cols-4 .qbox{width:12px; height:13px; margin-left:2px;}
    .cols-4 .topo-campos{font-size:.64rem; gap:4px;}
    .cols-4 .rot{font-size:.6rem;}
    .cols-4 .pag-opcoes{font-size:.64rem; gap:6px;}
    .cols-4 .check{width:11px; height:11px; margin-right:3px;}
    .cols-4 .total-linha{font-size:.84rem;}
    .cols-4 .legenda{display:none;}

    /* ==========================================================
       MODOS DE ECONOMIA: comandas EMPILHADAS em grade (3 ou 4 por folha)
       Menores, pra gastar menos papel. GRID (não column-count) pra
       imprimir igual à tela e caber N na MESMA folha.
       ========================================================== */
    .per-3 .comanda{ min-height:84mm;  padding:4mm 7mm; }
    .per-4 .comanda{ min-height:56mm;  padding:3mm 6mm; }
    .per-3 .grade,.per-4 .grade{display:grid; grid-template-columns:repeat(3,1fr); gap:3px 8px; align-content:start;}
    .per-3 td,.per-4 td{line-height:1.03;}
    .per-3 .cab img,.per-4 .cab img{height:24px;}
    .per-3 .cab h1,.per-4 .cab h1{font-size:.92rem;}
    .per-4 .cab .sub{display:none;}
    .per-3 .cat h2{font-size:.52rem;}     .per-3 td{font-size:.48rem; padding:.4px 3px;}   .per-3 .nome small{font-size:.44rem;}
    .per-3 .qbox{width:8px; height:9px;}
    .per-4 .cat h2{font-size:.5rem;}      .per-4 td{font-size:.46rem; padding:.6px 3px;}  .per-4 .nome small{display:none;}
    .per-4 .qbox{width:7px; height:8px; margin-left:1.5px;}
    .per-3 .rot,.per-4 .rot{font-size:.56rem;}
    .per-3 .pag-opcoes,.per-4 .pag-opcoes{font-size:.6rem;}
    .per-3 .total-linha,.per-4 .total-linha{font-size:.78rem;}
    .per-3 .legenda,.per-4 .legenda{display:none;}
    .per-3 .cab img{height:18px;}
    .per-3 .cab{padding-bottom:3px;}
    .per-3 .topo-campos{margin:4px 0 1px;}
    .per-3 .rodape{margin-top:4px; padding-top:3px;}
    .per-3 .cat h2{padding:1px 5px;}
    .per-4 .cab img{height:16px;}
    .per-4 .cab{padding-bottom:2px;}
    .per-4 .cab .comanda-tag{padding:2px 6px; font-size:.58rem;}
    .per-4 .topo-campos{margin:3px 0 1px; font-size:.62rem;}
    .per-4 .cat h2{padding:1px 5px;}
    .per-4 .rodape{margin-top:4px; padding-top:3px;}
    .per-3 .obs-rot, .per-3 .obs-linha,
    .per-4 .obs-rot, .per-4 .obs-linha{display:none;}

    /* BEBIDAS no 2 lado a lado: como sobra espaço, respira mais e letra um pouco maior */
    .tipo-bebida.lado .cat h2{font-size:.9rem; padding:3px 8px;}
    .tipo-bebida.lado .cat{margin-bottom:5px;}
    .tipo-bebida.lado td{font-size:.98rem; padding:4px 4px;}
    .tipo-bebida.lado .qbox{width:16px; height:17px;}
    .tipo-bebida.lado .topo-campos{font-size:.9rem; gap:6px 10px;}
    .tipo-bebida.lado .pag-opcoes{font-size:.94rem;}
    .tipo-bebida.lado .total-linha{font-size:1.2rem;}

    /* Faixa do tipo (Cozinha/Bar): diferencia em P&B por PADRÃO, não por cor.
       Comida = faixa sólida. Bebida = faixa listrada (diagonal). */
    .tipo-band{text-align:center; font-weight:800; letter-spacing:1px; color:#fff; border-radius:5px; margin:4px 0 2px; padding:3px 6px;
      text-shadow:0 1px 1px rgba(0,0,0,.35);}
    .tipo-band.comida{background:var(--laranja);}
    .tipo-band.bebida{background:var(--azul);}
    .lado .tipo-band{font-size:.82rem; margin:5px 0 3px;}
    .per-3 .tipo-band{font-size:.5rem; padding:1px 5px; margin:2px 0 1px;}
    .per-4 .tipo-band{font-size:.46rem; padding:1px 5px; margin:1px 0;}

    @media print{
      @page{ size:A4; margin:5mm; }
      html,body{background:#fff;}
      .acoes{display:none !important;}
      .folha{width:auto; margin:0; box-shadow:none;}
      *{-webkit-print-color-adjust:exact; print-color-adjust:exact;}
    }
  </style>
</head>
<body>

  <div class="acoes">
    <p>Escolha <b>o que</b> e <b>o formato</b>, imprima e <b>corte</b>. São duas versões: 🍽️ Comidas (cozinha) e 🥤 Bebidas (bar).</p>
    <div class="toggle" id="toggleTipo">
      <button data-tipo="comida">🍽️ Comidas</button>
      <button data-tipo="bebida">🥤 Bebidas</button>
    </div>
    <div class="toggle" id="toggle">
      <button data-modo="lado">2 lado a lado</button>
      <button data-modo="3">3 por folha</button>
      <button data-modo="4">4 por folha</button>
    </div>
    <button class="btn sec" id="btnNum">🔢 Numeradas 1–100</button>
    <button class="btn sec" onclick="location.href='comanda.html'">↤ Digital</button>
    <button class="btn" onclick="window.print()">🖨️ Imprimir / PDF</button>
  </div>

  <div class="acoes" style="border-top:none; box-shadow:none; padding-top:0; padding-bottom:4px;">
    <p style="flex:1; min-width:240px;">📄 <b>PDFs prontos</b> (1 folha cada, é só baixar e imprimir):</p>
    <span style="font-weight:700; color:#d9641a;">🍽️ Comidas:</span>
    <a class="btn sec" href="pdf/comanda-comidas-2-por-folha.pdf" download>⬇ 2 lado a lado</a>
    <a class="btn sec" href="pdf/comanda-comidas-3-por-folha.pdf" download>⬇ 3</a>
    <a class="btn sec" href="pdf/comanda-comidas-4-por-folha.pdf" download>⬇ 4 (2×2)</a>
    <a class="btn sec" href="pdf/comanda-comidas-numeradas-1-a-100.pdf" download>⬇ Numeradas 1–100</a>
  </div>
  <div class="acoes" style="border-top:none; box-shadow:none; padding-top:0;">
    <p style="flex:1; min-width:240px;"></p>
    <span style="font-weight:700; color:#1d3f70;">🥤 Bebidas:</span>
    <a class="btn sec" href="pdf/comanda-bebidas-2-por-folha.pdf" download>⬇ 2 lado a lado</a>
    <a class="btn sec" href="pdf/comanda-bebidas-3-por-folha.pdf" download>⬇ 3</a>
    <a class="btn sec" href="pdf/comanda-bebidas-4-por-folha.pdf" download>⬇ 4</a>
    <a class="btn sec" href="pdf/comanda-bebidas-numeradas-1-a-100.pdf" download>⬇ Numeradas 1–100</a>
  </div>

  <div class="folha lado" id="folha"></div>

  <script src="menu.js"></script>
  <script>
  (function () {
    function precoNum(p){ return parseFloat(String(p).replace(/\./g,"").replace(",",".")) || 0; }
    function precoFmt(n){ return n.toFixed(2).replace(".",","); }
    function precoPromo(txt){ const m = String(txt).match(/(\d+)(?!.*\d)/); return m ? m[1]+",00" : "0,00"; }

    function boxes(n){ let s=""; for(let i=0;i<n;i++) s+='<span class="qbox"></span>'; return s; }

    // monta blocos de um conjunto de grupos: subgrupos viram categoria única; guarda a promo (ex.: Drinks)
    function buildBlocos(grupos){
      const arr = [];
      (grupos||[]).forEach((g) => {
        const itens = g.subgrupos
          ? g.subgrupos.reduce((a,sg)=>a.concat(sg.itens),[])
          : g.itens;
        arr.push({ categoria:g.categoria, icone:g.icone||"", promo:g.promo, itens });
      });
      return arr;
    }
    // duas versões separadas: comidas (cozinha) e bebidas (bar)
    const BLOCOS = { comida: buildBlocos(CARDAPIO.comida), bebida: buildBlocos(CARDAPIO.bebida) };
    const TIPO_ROT = { comida: "COMIDAS · Cozinha", bebida: "BEBIDAS · Bar" };

    function linha(nome, desc, preco, promo, nbox){
      return `<tr class="${promo ? "promo-row" : ""}">
        <td class="nome">${nome}${desc ? `<small> ${desc}</small>` : ""}</td>
        <td class="pcol">${preco}</td>
        <td class="qcol">${boxes(nbox)}</td>
      </tr>`;
    }

    // Na tira vertical mantemos a ordem natural do cardápio (coluna única).
    // Nos modos em grade, categorias maiores primeiro equilibram as colunas.
    function gradeHTML(lista, ordenar, nbox){
      const arr = ordenar ? lista.slice().sort((a,b)=>b.itens.length-a.itens.length) : lista;
      return arr.map((b) => `
        <div class="cat">
          <h2>${b.categoria}</h2>
          <table><tbody>
            ${b.promo ? linha("Drink em dobro", "2 unidades", precoFmt(precoNum(precoPromo(b.promo))), true, nbox) : ""}
            ${b.itens.map((it) => linha(it.nome, it.desc, it.precoLivre ? '<span class="preco-livre"></span>' : precoFmt(precoNum(it.preco)), false, nbox)).join("")}
          </tbody></table>
        </div>`).join("");
    }

    // campos do topo (iguais nos dois tipos): Nome do cliente + Nº de pessoas
    function campos(tipo){
      return `
        <div class="c nome-c"><b>Nome:</b><span class="linha-preencher"></span></div>
        <div class="c pessoas-c"><b>Nº de pessoas:</b><span class="linha-preencher"></span></div>`;
    }

    function comandaHTML(tipo, ordenar, nbox, numero){
      const nro = (numero != null) ? String(numero).padStart(3, "0") : "______";
      return `
      <div class="cab">
        <img src="img/logo.png" alt="" onerror="this.style.display='none'" />
        <div class="tit">
          <h1>Chácara Lago JB</h1>
          <div class="sub">Vila Amazônia, Parintins</div>
        </div>
        <div class="comanda-tag">COMANDA Nº ${nro}</div>
      </div>
      <div class="tipo-band ${tipo}">${TIPO_ROT[tipo]}</div>
      <div class="topo-campos">${campos(tipo)}</div>
      <div class="grade">${gradeHTML(BLOCOS[tipo], ordenar, nbox)}</div>
      <div class="rodape">
        <div class="bloco">
          <div class="rot pag-rot">Pagamento</div>
          <div class="pag-opcoes">
            <span><span class="check"></span>Dinheiro</span>
            <span><span class="check"></span>PIX</span>
            <span><span class="check"></span>Débito</span>
            <span><span class="check"></span>Crédito</span>
          </div>
          <div class="rot obs-rot" style="margin-top:5px;">Observações</div>
          <div class="obs-linha"></div>
        </div>
        <div class="bloco total-cx">
          <div class="rot">Total a pagar</div>
          <div class="total-linha"><b>R$</b><span class="linha-preencher"></span></div>
        </div>
      </div>
      <div class="legenda">Cada ⬜ = 1 unidade · marque um quadradinho por pedido</div>`;
    }

    const folha = document.getElementById("folha");
    const toggle = document.getElementById("toggle");
    const toggleTipo = document.getElementById("toggleTipo");

    let curModo = "lado";
    let curTipo = "comida";

    // quantos quadradinhos por item conforme a largura da tira/célula
    function nboxPara(cols){ return cols >= 4 ? 3 : cols === 3 ? 4 : 5; }

    // tiras verticais lado a lado (estilo restaurante), com "cols" colunas
    function vertical(tipo, cols){
      const c = comandaHTML(tipo, false, nboxPara(cols)); // coluna única, ordem natural
      folha.className = "folha lado cols-" + cols + " tipo-" + tipo;
      let html = "";
      for(let i=0;i<cols;i++){
        html += `<div class="comanda">${c}</div>`;
        if(i < cols-1) html += `<div class="corte-v"><span>✂ corte aqui</span></div>`;
      }
      folha.innerHTML = html;
    }

    // 4 por folha em 2x2 (duas em cima, duas embaixo), cada uma vertical e larga
    // (metade da folha) pra manter a fonte legível sem encolher.
    function quad(tipo){
      const c = comandaHTML(tipo, false, 5); // coluna única, ordem natural, 5 quadradinhos (cabe: célula larga)
      folha.className = "folha quad tipo-" + tipo;
      folha.innerHTML = [0,1,2,3].map(() => `<div class="comanda">${c}</div>`).join("");
    }

    // comandas JÁ NUMERADAS de 1 até "total", no formato de cada tipo:
    //  - comida: 2x2 (4 por folha)  - bebida: 2 lado a lado (2 por folha)
    // Uma página por grupo, com quebra de página garantida.
    function numeradas(tipo, total){
      const porFolha = (tipo === "comida") ? 4 : 2;
      let html = "";
      for(let inicio=1; inicio<=total; inicio+=porFolha){
        const fim = Math.min(inicio + porFolha - 1, total);
        if(tipo === "comida"){
          let cells = "";
          for(let k=inicio; k<=fim; k++) cells += `<div class="comanda">${comandaHTML(tipo, false, 5, k)}</div>`;
          html += `<div class="pagina"><div class="quad tipo-${tipo}">${cells}</div></div>`;
        } else {
          let inner = "";
          for(let k=inicio; k<=fim; k++){
            inner += `<div class="comanda">${comandaHTML(tipo, false, 5, k)}</div>`;
            if(k < fim) inner += `<div class="corte-v"><span>✂ corte aqui</span></div>`;
          }
          html += `<div class="pagina"><div class="lado tipo-${tipo}">${inner}</div></div>`;
        }
      }
      folha.className = "folha numeradas";
      folha.innerHTML = html;
    }

    // comandas empilhadas em grade (bebidas 3/4 por folha, mais densas)
    function empilhado(tipo, n){
      const c = comandaHTML(tipo, true, 5); // grade equilibrada
      let html = "";
      for(let i=0;i<n;i++){
        html += `<div class="comanda">${c}</div>`;
        if(i < n-1) html += `<div class="corte">✂ &nbsp; corte aqui &nbsp; ✂</div>`;
      }
      folha.className = "folha per-" + n + " tipo-" + tipo;
      folha.innerHTML = html;
    }

    function render(modo, tipo, num){
      curModo = modo; curTipo = tipo;
      if(num > 0){ numeradas(tipo, num); return; } // versão numerada (1..num)
      // Comidas (poucos itens): 2/3 tiras verticais; 4 em 2x2 (grande, fonte legível).
      // Bebidas (densas): 2 em tira vertical; 3/4 empilhadas em grade.
      if(tipo === "comida"){
        if(modo === "4") quad(tipo);
        else vertical(tipo, modo === "lado" ? 2 : 3);
      } else if(modo === "lado"){
        vertical(tipo, 2);
      } else {
        empilhado(tipo, parseInt(modo, 10));
      }
      toggle.querySelectorAll("button").forEach((b) => b.classList.toggle("on", b.dataset.modo == modo));
      toggleTipo.querySelectorAll("button").forEach((b) => b.classList.toggle("on", b.dataset.tipo == tipo));
    }

    toggle.addEventListener("click", (e) => {
      const b = e.target.closest("button[data-modo]");
      if (b) render(b.dataset.modo, curTipo);
    });
    toggleTipo.addEventListener("click", (e) => {
      const b = e.target.closest("button[data-tipo]");
      if (b) render(curModo, b.dataset.tipo);
    });

    // abre no formato/tipo da URL (?modo=lado|3|4 & ?tipo=comida|bebida & ?num=100)
    const p = new URLSearchParams(location.search);
    let modo = p.get("modo");
    if(!modo){ const n = p.get("n"); modo = (n==="3"||n==="4") ? n : "lado"; }
    let tipo = p.get("tipo");
    const num = parseInt(p.get("num"), 10) || 0;
    render(["lado","3","4"].includes(modo) ? modo : "lado", ["comida","bebida"].includes(tipo) ? tipo : "comida", num);

    // botão "Numeradas 1–100" (usa o tipo atual)
    const btnNum = document.getElementById("btnNum");
    if(btnNum) btnNum.addEventListener("click", () => render(curModo, curTipo, 100));
  })();
  </script>
</body>
</html>
